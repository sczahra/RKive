<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>RKive</title>
<style>
:root{--wood1:#261107;--wood2:#5d2d13;--wood3:#9a5a24;--wood4:#d08a3e;--panel:#1a120c;--muted:#c8a978;--text:#fff1c7;--line:#4d2b14;--accent:#7ee787;--blue:#58a6ff;--good:#7ee787;--warn:#f2cc60;--black:#080604}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,rgba(255,224,150,.16),transparent 26%),linear-gradient(135deg,#1b1009,#090603 60%,#160c06);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;background:repeating-linear-gradient(90deg,rgba(255,222,144,.04) 0 2px,transparent 2px 18px),repeating-linear-gradient(12deg,transparent 0 18px,rgba(0,0,0,.08) 18px 23px)}button,input,select{font:inherit}a{color:var(--blue)}.app{width:min(1500px,calc(100vw - clamp(14px,3vw,48px)));margin:0 auto;padding:clamp(12px,2vw,24px) 0 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px;padding:clamp(14px,2vw,22px);border:5px solid #2b1308;border-radius:22px;background:linear-gradient(90deg,var(--wood1),var(--wood3) 22%,var(--wood2) 50%,var(--wood4) 78%,var(--wood1));box-shadow:0 18px 38px rgba(0,0,0,.42),inset 0 0 0 3px rgba(255,222,150,.18)}.brand h1{font-size:clamp(38px,6vw,76px);margin:0;letter-spacing:-.07em;text-shadow:0 4px 0 #120803}.brand p{margin:4px 0 0;color:#f0cd8a}.search{display:grid;grid-template-columns:1fr auto;gap:10px;min-width:min(620px,55vw)}input,select{background:#120b07;color:var(--text);border:2px solid #6d421d;border-radius:12px;padding:12px 14px}button{border:2px solid #6d421d;background:linear-gradient(#352015,#17100b);color:var(--text);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}button:hover{border-color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(230px,280px) 1fr;gap:18px}.sidebar,.main,.watch{background:linear-gradient(180deg,rgba(255,230,160,.06),transparent),rgba(26,18,12,.94);border:4px solid #3a1b0b;border-radius:22px;padding:16px;box-shadow:0 22px 48px rgba(0,0,0,.38),inset 0 0 0 3px rgba(255,214,129,.08)}.watch{position:relative}.watch:before{content:"";position:absolute;inset:-12px;border:6px solid #2b1308;border-radius:28px;background:linear-gradient(90deg,var(--wood1),var(--wood3),var(--wood2),var(--wood4),var(--wood1));z-index:-1;box-shadow:0 16px 40px rgba(0,0,0,.45)}.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}.channel{display:block;width:100%;text-align:left;margin:8px 0;background:#120b07}.channel.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(126,231,135,.18)}.library-row{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--muted);padding:8px 0;border-top:1px solid rgba(180,124,58,.42)}.filters{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:14px}.card{background:#100907;border:2px solid #4a2a14;border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .14s,border-color .14s}.card:hover{transform:translateY(-2px);border-color:var(--accent)}.thumb{aspect-ratio:16/10;background:#05070a;display:block;width:100%;object-fit:cover}.card-body{padding:12px}.card h3{font-size:15px;margin:0 0 8px;line-height:1.25}.meta{font-size:12px;color:var(--muted);line-height:1.35}.status{margin:0 0 14px;color:var(--muted)}.watch{display:none;margin-bottom:26px}.watch.open{display:block}.watch-grid{display:grid;grid-template-columns:minmax(320px,1fr)minmax(280px,380px);gap:16px}.player-wrap{background:#030302;border:10px solid #1c211b;border-radius:34px/28px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center;box-shadow:inset 0 0 38px #000,0 12px 28px rgba(0,0,0,.44)}video,iframe{width:100%;height:100%;border:0;background:#000}.fallback{padding:24px;text-align:center;color:var(--muted)}.details h2{margin:0 0 8px}.badges{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.badge{font-size:12px;border:1px solid #6d421d;border-radius:999px;padding:5px 8px;color:var(--muted)}.badge.good{color:var(--good);border-color:rgba(126,231,135,.55)}.badge.warn{color:var(--warn);border-color:rgba(242,204,96,.55)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}.check{display:flex;gap:7px;align-items:center;color:var(--muted);border:2px solid #6d421d;border-radius:12px;padding:10px 12px;background:#120b07}.check input{padding:0}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #6d421d;border-radius:14px}.small{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tab.active{border-color:var(--accent);background:#13351f}.copy-ok{color:var(--accent);font-size:12px;margin-left:4px}@media(max-width:950px){.top{display:block}.search{min-width:0;margin-top:14px}.layout,.watch-grid,.filters{grid-template-columns:1fr}.sidebar{order:2}.player-wrap{border-width:7px;border-radius:24px}.search{grid-template-columns:1fr}}@media(max-width:520px){.app{width:calc(100vw - 12px);padding-top:8px}.top,.sidebar,.main,.watch{border-width:3px;border-radius:16px;padding:12px}.actions button,.check{width:100%;justify-content:center}.brand h1{font-size:44px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>RKive</h1><p>Watch the public archive.</p></div>
    <form class="search" id="searchForm"><input id="searchInput" placeholder="Search Internet Archive video..." value="space" /><button>Search</button></form>
  </header>
  <section class="watch" id="watchPanel"></section>
  <section class="layout">
    <aside class="sidebar">
      <p class="section-title">Channels</p><div id="channels"></div>
      <p class="section-title" style="margin-top:22px">Local Library</p>
      <div class="library-row"><span>Favorites</span><strong id="favCount">0</strong></div>
      <div class="library-row"><span>Watch History</span><strong id="historyCount">0</strong></div>
      <div class="library-row"><span>Playlist</span><strong id="playlistCount">0</strong></div>
      <p class="small" style="margin-top:18px">RKive stores only local lists and preferences in this browser.</p>
    </aside>
    <main class="main">
      <div class="tabs"><button class="tab active" id="resultsTab">Results</button><button class="tab" id="favoritesTab">Favorites</button><button class="tab" id="playlistTab">Playlist</button><button class="tab" id="historyTab">History</button></div>
      <div class="filters">
        <select id="sortSelect"><option value="downloads desc">Sort: Popular</option><option value="date desc">Sort: Newest</option><option value="date asc">Sort: Oldest</option><option value="titleSorter asc">Sort: Title A-Z</option></select>
        <input id="yearStart" placeholder="From year" inputmode="numeric" />
        <input id="yearEnd" placeholder="To year" inputmode="numeric" />
        <select id="collectionSelect"><option value="">All collections</option><option value="prelinger">Prelinger</option><option value="nasa">NASA</option><option value="classic_tv">Classic TV</option><option value="feature_films">Feature Films</option></select>
      </div>
      <p class="status" id="status">Ready.</p><div class="grid" id="results"></div>
    </main>
  </section>
</div>
<script>
const channelsEl=document.getElementById('channels'),resultsEl=document.getElementById('results'),statusEl=document.getElementById('status'),watchPanel=document.getElementById('watchPanel');
const searchForm=document.getElementById('searchForm'),searchInput=document.getElementById('searchInput'),sortSelect=document.getElementById('sortSelect'),yearStart=document.getElementById('yearStart'),yearEnd=document.getElementById('yearEnd'),collectionSelect=document.getElementById('collectionSelect');
const favCount=document.getElementById('favCount'),historyCount=document.getElementById('historyCount'),playlistCount=document.getElementById('playlistCount');
const tabs={results:document.getElementById('resultsTab'),favorites:document.getElementById('favoritesTab'),playlist:document.getElementById('playlistTab'),history:document.getElementById('historyTab')};
const CHANNELS=[{name:'Public Video',query:'mediatype:movies'},{name:'Prelinger',query:'collection:prelinger AND mediatype:movies'},{name:'NASA',query:'collection:nasa AND mediatype:movies'},{name:'Classic TV',query:'collection:classic_tv AND mediatype:movies'},{name:'Public Domain Films',query:'collection:feature_films AND mediatype:movies'},{name:'Vintage Ads',query:'collection:prelinger AND mediatype:movies AND (advertising OR commercial)'},{name:'Noir',query:'collection:feature_films AND mediatype:movies AND (noir OR crime OR mystery)'},{name:'Educational',query:'collection:prelinger AND mediatype:movies AND (education OR training OR science)'}];
const LS={fav:'rkive:favorites',hist:'rkive:history',play:'rkive:playlist',random:'rkive:randomNext',autoplay:'rkive:autoplayNext'};let currentResults=[];let activeChannel='';let currentItem=null;
const read=k=>JSON.parse(localStorage.getItem(k)||'[]');const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const hasItem=(k,id)=>read(k).some(x=>x.identifier===id);const saveUnique=(k,item)=>{const list=read(k).filter(x=>x.identifier!==item.identifier);list.unshift(item);write(k,list.slice(0,200));updateCounts()};const removeItem=(k,id)=>{write(k,read(k).filter(x=>x.identifier!==id));updateCounts()};
function updateCounts(){favCount.textContent=read(LS.fav).length;historyCount.textContent=read(LS.hist).length;playlistCount.textContent=read(LS.play).length}
function setStatus(t){statusEl.textContent=t}function thumb(id){return `https://archive.org/services/img/${encodeURIComponent(id)}`}function itemUrl(id){return `https://archive.org/details/${encodeURIComponent(id)}`}function embedUrl(id){return `https://archive.org/embed/${encodeURIComponent(id)}`}
function renderChannels(){channelsEl.innerHTML='';CHANNELS.forEach(ch=>{const b=document.createElement('button');b.className='channel';b.textContent=ch.name;b.classList.toggle('active',activeChannel===ch.name);b.onclick=()=>{activeChannel=ch.name;renderChannels();searchArchive(ch.query,ch.name)};channelsEl.appendChild(b)})}
function filterQuery(base){let q=base;const c=collectionSelect.value;if(c&&!q.includes('collection:'))q+=` AND collection:${c}`;const ys=yearStart.value.trim(),ye=yearEnd.value.trim();if(ys||ye){const a=ys||'0000',b=ye||'9999';q+=` AND year:[${a} TO ${b}]`}return q}
function archiveSearchUrl(query){const p=new URLSearchParams();p.set('q',filterQuery(query));['identifier','title','creator','date','year','collection','description','licenseurl','rights','possible-copyright-status','subject'].forEach(f=>p.append('fl[]',f));p.set('sort[]',sortSelect.value);p.set('rows','48');p.set('page','1');p.set('output','json');return `https://archive.org/advancedsearch.php?${p.toString()}`}
async function searchArchive(query,label='Search'){setActiveTab('results');watchPanel.classList.remove('open');setStatus(`${label}: searching...`);resultsEl.innerHTML='<div class="empty">Searching Internet Archive...</div>';try{const res=await fetch(archiveSearchUrl(query));if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json();currentResults=(data.response?.docs||[]).filter(x=>x.identifier);renderCards(currentResults);setStatus(`${label}: ${currentResults.length} results`) }catch(e){resultsEl.innerHTML='<div class="empty">Search failed. Try a different channel or search term.</div>';setStatus(`Search failed: ${e.message}`)}}
function rerunSearch(){const q=activeChannel?(CHANNELS.find(c=>c.name===activeChannel)?.query||'mediatype:movies'):`mediatype:movies AND (${searchInput.value.trim()||'video'})`;searchArchive(q,activeChannel||'Search')}
function setActiveTab(name){Object.entries(tabs).forEach(([k,b])=>b.classList.toggle('active',k===name))}
function renderCards(items){if(!items.length){resultsEl.innerHTML='<div class="empty">Nothing here yet.</div>';return}resultsEl.innerHTML='';items.forEach(item=>{const c=document.createElement('article');c.className='card';c.innerHTML=`<img class="thumb" src="${thumb(item.identifier)}" loading="lazy" alt=""><div class="card-body"><h3>${escapeHtml(item.title||item.identifier)}</h3><div class="meta">${escapeHtml(item.creator||'Unknown creator')}<br>${escapeHtml(item.date||item.year||'No date')} · ${escapeHtml(firstCollection(item.collection))}</div></div>`;c.onclick=()=>openItem(item);resultsEl.appendChild(c)})}
function firstCollection(c){return Array.isArray(c)?c[0]:(c||'IA')}function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]))}
async function openItem(item){currentItem=item;saveUnique(LS.hist,item);setStatus(`Loading ${item.title||item.identifier}...`);watchPanel.classList.add('open');watchPanel.innerHTML='<div class="empty">Loading item metadata...</div>';try{const res=await fetch(`https://archive.org/metadata/${encodeURIComponent(item.identifier)}`);if(!res.ok)throw new Error(`HTTP ${res.status}`);const meta=await res.json();const selected=pickVideoFile(meta.files||[]);renderWatch(item,meta,selected);setStatus(selected?'Ready.':'No browser-friendly MP4 found. Showing embed fallback.')}catch(e){renderWatch(item,null,null);setStatus(`Metadata failed: ${e.message}`)}}
function pickVideoFile(files){const mp4=files.filter(f=>String(f.name||'').toLowerCase().endsWith('.mp4'));mp4.sort((a,b)=>scoreFile(a)-scoreFile(b));return mp4[0]||null}function scoreFile(f){const n=String(f.name||'').toLowerCase(),fmt=String(f.format||'').toLowerCase();let s=50;if(n.includes('512kb')||fmt.includes('512kb'))s-=30;if(fmt.includes('mpeg4'))s-=10;if(n.includes('h.264')||fmt.includes('h.264'))s-=8;s+=(Number(f.size)||500000000)/100000000;return s}
function fileUrl(id,name){return `https://archive.org/download/${encodeURIComponent(id)}/${String(name).split('/').map(encodeURIComponent).join('/')}`}function rightsBadge(item,meta){const m=meta?.metadata||{};const text=m.licenseurl||m.rights||item.licenseurl||item.rights||item['possible-copyright-status']||m['possible-copyright-status']||'Rights metadata unavailable';let cls='warn';if(String(text).toLowerCase().includes('public domain')||String(text).toLowerCase().includes('creativecommons'))cls='good';return `<span class="badge ${cls}">${escapeHtml(text).slice(0,100)}</span>`}
function nextItem(){const pool=currentResults.length?currentResults:read(LS.hist);if(!pool.length)return;const random=document.getElementById('randomNext')?.checked;let idx=pool.findIndex(x=>x.identifier===currentItem?.identifier);let next;if(random){do{next=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&next.identifier===currentItem?.identifier)}else{next=pool[(idx+1+pool.length)%pool.length]}openItem(next)}
function relatedVideos(item){const terms=[];const collections=[].concat(item.collection||[]).filter(Boolean);if(collections[0])terms.push(`collection:${collections[0]}`);const subject=[].concat(item.subject||[]).filter(Boolean)[0];if(subject)terms.push(`subject:"${String(subject).replace(/"/g,'')}"`);const creator=item.creator;if(creator)terms.push(`creator:"${String(creator).replace(/"/g,'')}"`);const q=terms.length?`mediatype:movies AND (${terms.join(' OR ')})`:`mediatype:movies AND (${(item.title||'video').split(/\s+/).slice(0,3).join(' ')})`;activeChannel='';renderChannels();searchArchive(q,'Related')}
async function copyText(text,label){try{await navigator.clipboard.writeText(text);setStatus(`${label} copied`)}catch{setStatus(`Could not copy ${label.toLowerCase()}`)}}
function fallbackMarkup(id){return `<div class="fallback"><p>RKive could not play the direct video file in this browser.</p><p>You can use the Internet Archive embed player or open the source item.</p><button id="fallbackEmbed">Use IA Embed</button></div>`}
function renderWatch(item,meta,selected){const m=meta?.metadata||{};const src=selected?fileUrl(item.identifier,selected.name):'';const randomChecked=localStorage.getItem(LS.random)==='true';const autoplayChecked=localStorage.getItem(LS.autoplay)==='true';const isFav=hasItem(LS.fav,item.identifier),inPlay=hasItem(LS.play,item.identifier);watchPanel.innerHTML=`<div class="watch-grid"><div><div class="player-wrap">${selected?`<video controls autoplay playsinline src="${src}"></video>`:fallbackMarkup(item.identifier)}</div><div class="actions"><button id="nextBtn">Next</button><label class="check"><input id="randomNext" type="checkbox" ${randomChecked?'checked':''}> Random</label><label class="check"><input id="autoplayNext" type="checkbox" ${autoplayChecked?'checked':''}> Autoplay</label><button id="useEmbed">Use IA Embed</button><button id="relatedBtn">Related Videos</button><button id="favBtn">${isFav?'Remove Favorite':'Favorite'}</button><button id="playlistBtn">${inPlay?'Remove Playlist':'Add to Playlist'}</button><button id="copySource">Copy Source</button><button id="copyRkive">Copy RKive Link</button><a href="${itemUrl(item.identifier)}" target="_blank" rel="noreferrer"><button>Open Source</button></a></div></div><div class="details"><h2>${escapeHtml(m.title||item.title||item.identifier)}</h2><div class="badges"><span class="badge">${escapeHtml(m.date||item.date||item.year||'No date')}</span><span class="badge">${escapeHtml(firstCollection(m.collection||item.collection))}</span>${rightsBadge(item,meta)}</div><p class="meta"><strong>Creator:</strong> ${escapeHtml(m.creator||item.creator||'Unknown')}</p><p>${escapeHtml(m.description||item.description||'No description available.').slice(0,900)}</p><p class="small"><strong>Identifier:</strong> ${escapeHtml(item.identifier)}${selected?`<br><strong>File:</strong> ${escapeHtml(selected.name)}`:''}</p></div></div>`;const showEmbed=()=>{watchPanel.querySelector('.player-wrap').innerHTML=`<iframe src="${embedUrl(item.identifier)}" allowfullscreen></iframe>`};document.getElementById('nextBtn').onclick=nextItem;document.getElementById('randomNext').onchange=e=>localStorage.setItem(LS.random,String(e.target.checked));document.getElementById('autoplayNext').onchange=e=>localStorage.setItem(LS.autoplay,String(e.target.checked));document.getElementById('useEmbed').onclick=showEmbed;document.getElementById('relatedBtn').onclick=()=>relatedVideos(item);document.getElementById('favBtn').onclick=()=>{hasItem(LS.fav,item.identifier)?removeItem(LS.fav,item.identifier):saveUnique(LS.fav,item);renderWatch(item,meta,selected)};document.getElementById('playlistBtn').onclick=()=>{hasItem(LS.play,item.identifier)?removeItem(LS.play,item.identifier):saveUnique(LS.play,item);renderWatch(item,meta,selected)};document.getElementById('copySource').onclick=()=>copyText(itemUrl(item.identifier),'Source link');document.getElementById('copyRkive').onclick=()=>copyText(`${location.origin}${location.pathname}#${encodeURIComponent(item.identifier)}`,'RKive link');const fb=document.getElementById('fallbackEmbed');if(fb)fb.onclick=showEmbed;watchPanel.scrollIntoView({behavior:'smooth',block:'start'});const v=watchPanel.querySelector('video');if(v){v.onerror=()=>{setStatus('Direct video failed. Showing fallback options.');watchPanel.querySelector('.player-wrap').innerHTML=fallbackMarkup(item.identifier);document.getElementById('fallbackEmbed').onclick=showEmbed};v.onended=()=>{if(document.getElementById('autoplayNext')?.checked)nextItem()}}}
function showLocal(kind,key){setActiveTab(kind);watchPanel.classList.remove('open');currentResults=read(key);renderCards(currentResults);setStatus(`${kind}: ${currentResults.length} saved item${currentResults.length===1?'':'s'}`)}
searchForm.onsubmit=e=>{e.preventDefault();activeChannel='';renderChannels();rerunSearch()};[sortSelect,yearStart,yearEnd,collectionSelect].forEach(el=>el.addEventListener('change',rerunSearch));
tabs.results.onclick=()=>{setActiveTab('results');renderCards(currentResults);setStatus(`Results: ${currentResults.length}`)};tabs.favorites.onclick=()=>showLocal('favorites',LS.fav);tabs.playlist.onclick=()=>showLocal('playlist',LS.play);tabs.history.onclick=()=>showLocal('history',LS.hist);
renderChannels();updateCounts();searchArchive(CHANNELS[0].query,CHANNELS[0].name);if(location.hash){openItem({identifier:decodeURIComponent(location.hash.slice(1))})}
</script>
</body>
</html>
